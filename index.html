```html
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pablogna</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #f5f1e8;
            color: #252525;

            font-family: Georgia, "Times New Roman", serif;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 40px 25px;
            text-align: center;
        }

        h1 {
            margin: 0 0 20px 0;

            font-size: 40px;
            font-weight: normal;
            letter-spacing: 8px;
        }

        .instruction {
            margin: 0 0 50px 0;

            font-family: Arial, sans-serif;
            font-size: 15px;
            letter-spacing: 1px;
            color: #666;
        }

        button {
            width: 140px;
            height: 140px;

            border-radius: 50%;
            border: 1px solid #252525;

            background: transparent;
            color: #252525;

            font-family: Arial, sans-serif;
            font-size: 44px;
            font-weight: normal;

            cursor: pointer;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 0 auto;

            transition:
                background 0.25s ease,
                color 0.25s ease,
                transform 0.15s ease;
        }

        button:hover {
            background: #252525;
            color: #f5f1e8;
        }

        button:active {
            transform: scale(0.96);
        }

        .status {
            margin-top: 30px;

            font-family: Arial, sans-serif;
            font-size: 13px;
            letter-spacing: 1.5px;
            color: #888;

            min-height: 18px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>PABLOGNA</h1>

        <p class="instruction">
            Indossa le cuffie e ascolta
        </p>

        <button id="playButton" aria-label="Riproduci Pablogna">
            ▶
        </button>

        <div class="status" id="status">
            Premi per ascoltare
        </div>

        <audio id="audio" preload="metadata">
            <source src="Pablogna.mp3" type="audio/mpeg">
        </audio>

    </div>

    <script>
        const audio = document.getElementById("audio");
        const button = document.getElementById("playButton");
        const status = document.getElementById("status");

        button.addEventListener("click", function () {

            if (audio.paused) {

                audio.play();

                button.textContent = "Ⅱ";
                button.setAttribute("aria-label", "Metti in pausa");
                status.textContent = "In ascolto...";

            } else {

                audio.pause();

                button.textContent = "▶";
                button.setAttribute("aria-label", "Riproduci Pablogna");
                status.textContent = "In pausa";
            }
        });

        audio.addEventListener("ended", function () {

            button.textContent = "▶";
            button.setAttribute("aria-label", "Riproduci Pablogna");
            status.textContent = "Premi per riascoltare";

        });
    </script>

</body>
</html>
```
