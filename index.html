```html
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pablogna</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: white;
            color: #222;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        h1 {
            font-size: 32px;
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        p {
            font-size: 17px;
            margin-bottom: 35px;
        }

        button {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 2px solid #222;
            background: white;
            color: #222;
            font-size: 42px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
        }

        button:hover {
            background: #f2f2f2;
        }

        button:active {
            transform: scale(0.97);
        }

        .status {
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>PABLOGNA</h1>

        <p>Indossa le cuffie e premi Play</p>

        <button id="playButton" aria-label="Riproduci Pablogna">
            ▶
        </button>

        <div class="status" id="status">
            Premi Play per ascoltare
        </div>

        <audio id="audio" preload="metadata">
            <source src="Pablogna.mp3" type="audio/mpeg">
        </audio>

    </div>

    <script>
        const audio = document.getElementById("audio");
        const button = document.getElementById("playButton");
        const status = document.getElementById("status");

        button.addEventListener("click", function () {

            if (audio.paused) {
                audio.play();

                button.textContent = "❚❚";
                button.setAttribute("aria-label", "Metti in pausa");
                status.textContent = "Pablogna in riproduzione";
            } else {
                audio.pause();

                button.textContent = "▶";
                button.setAttribute("aria-label", "Riproduci Pablogna");
                status.textContent = "In pausa";
            }
        });

        audio.addEventListener("ended", function () {
            button.textContent = "▶";
            button.setAttribute("aria-label", "Riproduci Pablogna");
            status.textContent = "Premi Play per riascoltare";
        });
    </script>

</body>
</html>
```
